name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点一次「Run workflow」重新部署（不需要改代码）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只对「构建」做并发控制：新的一次 push 会取消**排队中/进行中**的旧构建，
# 避免浪费 runner。注意 deploy job 不在这个 group 里 ——
# 否则新旧两次运行会互相取消，导致最新提交永远部署不上去
# （之前就是这样：run#4 被手动 rerun 的 run#1 取消了）。
concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build
        run: pnpm run build
        env:
          # 中转地址：在仓库 Settings → Secrets and variables → Actions →
          # Variables 里配置 VITE_EDGE_TTS_PROXY（不是 Environments 那一栏）。
          # 不配置的话只有桌面 Edge 能合成，原因见 README 开头。
          VITE_EDGE_TTS_PROXY: ${{ vars.VITE_EDGE_TTS_PROXY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
